<style>
:root{box-sizing:border-box;color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#050506;--tx:#f5f5f7;--mut:#a3a3ae;--bd:#2c2c34;--gold:#d6d6dc;--s3:#8d8d97}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;color:var(--tx);font-family:Georgia,"Times New Roman",serif;line-height:1.5;background:radial-gradient(120% 60% at 50% -10%,#24242b 0%,transparent 60%),radial-gradient(90% 50% at 100% 100%,#17171c,transparent 60%),var(--bg);background-attachment:fixed}
.wrap{max-width:480px;margin:0 auto;padding:0 0 40px;text-align:center}
.hero{position:relative;width:100%;aspect-ratio:1.62/1;overflow:hidden;border-radius:0 0 26px 26px;background:#0f0f13}
.hero img{display:block;width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,5,6,.15) 0%,rgba(5,5,6,.1) 45%,rgba(5,5,6,.85) 100%)}
.in{padding:0 20px}
/* logo girando (mesma animação do quiz e do suporte) */
.l3{perspective:800px;width:190px;height:190px;margin:-112px auto 0;position:relative;z-index:2;filter:drop-shadow(0 14px 24px rgba(255,255,255,.18))}
.l3r{position:absolute;inset:0;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;animation:spin360 7s linear infinite}
.l3 img{position:absolute;inset:15.5%;width:69%;height:69%;display:block;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.l3 img.f{transform:translateZ(2px)}
.l3 img.b{transform:rotateY(180deg) translateZ(2px)}
.l3 .rg{position:absolute;inset:11%;border-radius:50%;background:conic-gradient(from 0deg,rgba(255,255,255,0),#fff 18%,rgba(255,255,255,0) 40%,rgba(180,180,190,.9) 62%,rgba(255,255,255,0) 80%);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));animation:rot 4s linear infinite;filter:drop-shadow(0 0 6px rgba(255,255,255,.75))}
.l3 .eg{position:absolute;inset:15.5%;border-radius:50%;background:linear-gradient(145deg,#d6d6dc,#2c2c34);transform:translateZ(var(--z))}
@keyframes spin360{0%,10%{transform:rotateX(8deg) rotateY(0) translateY(0);animation-timing-function:ease-in-out}45%,60%{transform:rotateX(8deg) rotateY(180deg) translateY(-8px);animation-timing-function:ease-in-out}95%,100%{transform:rotateX(8deg) rotateY(360deg) translateY(0)}}
@keyframes rot{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.l3r,.l3 .rg,.btn::after{animation:none}}
h1{margin:-10px 0 0;font-size:30px;line-height:1.15;font-weight:700;letter-spacing:5px;text-transform:uppercase}
.line{width:56px;height:2px;margin:14px auto;border-radius:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.desc{margin:0 auto 30px;max-width:340px;color:var(--mut);font:15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
.btn{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;width:100%;min-height:76px;margin:0 0 16px;padding:14px 18px 14px 14px;border-radius:50px;text-decoration:none;color:#fff;text-align:left;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;touch-action:manipulation;-webkit-user-select:none;user-select:none;outline:none}
.btn:focus-visible{box-shadow:0 0 0 3px rgba(255,255,255,.45)}
.btn:active{transform:scale(.98)}
.btn img{flex:none;width:48px;height:48px;border-radius:50%;display:block}
.btn .t{flex:1;min-width:0}
.btn b{display:block;font-size:16.5px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;line-height:1.2}
.btn small{display:block;margin-top:3px;font-size:12.5px;font-weight:500;letter-spacing:.2px;color:var(--mut)}
.btn svg{flex:none;width:20px;height:20px;display:block}
.main{background:linear-gradient(145deg,#fff 0%,#d3d3da 45%,#9b9ba5 100%);color:#0a0a0c;box-shadow:0 10px 26px rgba(255,255,255,.14),inset 0 1px 0 #fff,inset 0 -3px 0 rgba(0,0,0,.18)}
.alt{background:linear-gradient(145deg,#1e1e24,#0f0f13);border:1.5px solid #4a4a54;box-shadow:0 8px 18px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.07)}
.btn::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:36%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.7),transparent);transform:skewX(-20deg);animation:shine 3.8s ease-in-out infinite;pointer-events:none}
.alt::after{opacity:.3}
.main small{color:#3a3a44}
@keyframes shine{0%,55%{left:-60%}100%{left:140%}}
.safe{display:inline-flex;align-items:center;gap:10px;margin-top:24px;padding:10px 18px 10px 12px;border-radius:50px;border:1px solid var(--bd);background:linear-gradient(145deg,#18181d,#0f0f13);text-align:left;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.safe .ic{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--gold);background:linear-gradient(145deg,#33333c,#17171c);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.safe svg{width:17px;height:17px;display:block}
.safe b{display:block;font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;line-height:1.2}
.safe span{display:block;font-size:11.5px;color:var(--mut);line-height:1.3}
.foot{margin-top:18px;color:#6b6b75;font:12px system-ui,sans-serif;letter-spacing:.5px}
</style>
</head>
